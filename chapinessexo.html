<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Antigua Guatemala 💬</title>
  <meta name="description" content="Chat Antigua Guatemala - Conecta con personas en tiempo real desde toda Guatemala." />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384031.png" type="image/png" />

  <style>
    /* === RESETEO Y VARIABLES === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    :root {
      --vh: 1vh;
      --bg-dark: #0b0c10;
      --bg-header: #16181d;
      --text-color: #f1f1f1;
      --accent: #00c389;
      --border: #26292f;
      --header-height: 60px;
    }

    /* === ESTILOS BÁSICOS === */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* === HEADER === */
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      position: relative;
      z-index: 10;
    }

    header img {
      height: 32px;
      width: 32px;
      border-radius: 8px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .3px;
    }

    /* === CONTENEDOR PRINCIPAL === */
    .wrap {
      flex-grow: 1;
      height: calc(var(--vh, 1vh) * 100 - var(--header-height));
      background: radial-gradient(circle at top left, #12141a, #0a0b0e);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    /* === MODO CLARO AUTOMÁTICO === */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-dark: #f7f8f9;
        --bg-header: #fff;
        --text-color: #111;
        --border: #dcdfe3;
      }
      body { background: var(--bg-dark); }
    }

    /* === RESPONSIVO === */
    @media (max-width: 480px) {
      :root { --header-height: 52px; }
      header { padding: .5rem .75rem; }
      header img { height: 26px; width: 26px; }
    }

    /* === MENSAJE DE FALLBACK === */
    #fallback {
      display: none;
      text-align: center;
      padding: 2rem;
      font-size: 1rem;
      color: #bbb;
    }

    #fallback strong {
      color: var(--accent);
    }
  </style>

  <script>
    // Corrige la altura 100vh en móviles
    function setVh() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', setVh);
    window.addEventListener('DOMContentLoaded', setVh);

    // Canal fijo (seguridad y control)
    const fixedChannel = "antigua_guatemala";
    const baseUrl = "https://chat.chatzona.org/index.html#nick=&channel=" + fixedChannel;

    window.addEventListener("DOMContentLoaded", () => {
      const iframe = document.getElementById("chatFrame");
      iframe.src = baseUrl;

      // Verifica cuando el iframe intenta cambiar de canal
      iframe.addEventListener("load", () => {
        if (!iframe.src.includes("#channel=" + fixedChannel)) {
          iframe.src = baseUrl;
        }
      });

      // Fallback si no carga
      iframe.onerror = () => {
        document.getElementById("fallback").style.display = "block";
      };
    });
  </script>
</head>

<body>
  <header>
    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384031.png" alt="Logo de Chat Guatemala" />
    <h1>Chat Antigua Guatemala</h1>
  </header>

  <div class="wrap">
    <iframe
      id="chatFrame"
      title="Chat en vivo Antigua Guatemala"
      loading="lazy"
      referrerpolicy="no-referrer"
      allow="clipboard-read; clipboard-write"
      sandbox="allow-same-origin allow-scripts allow-forms"
    ></iframe>

    <div id="fallback">
      <p>⚠️ No se pudo cargar el chat.</p>
      <p>Por favor, intenta <strong>recargar la página</strong> o verifica tu conexión.</p>
    </div>
  </div>
</body>
</html>
