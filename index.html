<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5007738499288847"
     crossorigin="anonymous"></script>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>╔═ CHAT CHAPIN ═╗</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');

    /* Fondo del canvas de partículas */
   #particles-js {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    background-size: 400% 400%;
    animation: gradientChange 10s ease infinite;
}

@keyframes gradientChange {
    0% {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }
    25% {
        background: linear-gradient(135deg, #3a6073, #16222a, #6b8e23);
    }
    50% {
        background: linear-gradient(135deg, #ff7e5f, #feb47b, #d16ba5);
    }
    75% {
        background: linear-gradient(135deg, #2c5364, #0f2027, #203a43);
    }
    100% {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }
}

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .title-container {
        text-align: center;
        width: 100%;
    }

    h1 {
        color: white;
        text-align: center;
        font-family: 'Lobster', cursive;
    }

    form {
        text-align: center;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        max-width: 90%;
        margin: 20px;
    }

    input[type="button"] {
        background: #ff7e5f;
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 5px;
        transition: background 0.3s ease;
    }

    input[type="button"]:hover {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }

    label {
        display: block;
        margin: 10px 0;
    }

    img {
        width: 100px;
        height: auto;
        margin-bottom: 20px;
    }

    @media (max-width: 600px) {
        form {
            padding: 10px;
        }
        input[type="button"] {
            font-size: 14px;
            padding: 8px 16px;
        }
        h1 {
            font-size: 24px;
        }
    }
</style>
</head>
<body>
    <!-- Contenedor para las partículas -->
    <div id="particles-js"></div>

    <div class="title-container">
        <img src="index_archivos/chating.jpg" alt="Imagen de Chat" />
        <h1>CHAT CHAPIN</h1>
    </div>

    <form id="form1" name="form1" method="post">
        <label>1. Chat Conocer Personas.
            <input type="button" value="ENTRAR" onClick="window.location.href='chapiness.html';" />
        </label>
        <p>
            <label>2. Chat Ligar.
                <input type="button" value="ENTRAR" onClick="window.location.href='chapinessexo.html';" />
            </label>
        </p>
    </form>

    <!-- particles.js library -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <!-- Configuración de partículas -->
    <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 80,
          "density": {
            "enable": true,
            "value_area": 800
          }
        },
        "color": {
          "value": "#ffffff"
        },
        "shape": {
          "type": "circle"
        },
        "opacity": {
          "value": 0.5,
          "random": false
        },
        "size": {
          "value": 3,
          "random": true
        },
        "line_linked": {
          "enable": true,
          "distance": 150,
          "color": "#ffffff",
          "opacity": 0.4,
          "width": 1
        },
        "move": {
          "enable": true,
          "speed": 3,
          "direction": "none",
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": {
            "enable": true,
            "mode": "repulse"
          },
          "onclick": {
            "enable": true,
            "mode": "push"
          },
          "resize": true
        },
        "modes": {
          "repulse": {
            "distance": 100,
            "duration": 0.4
          },
          "push": {
            "particles_nb": 4
          }
        }
      },
      "retina_detect": true
    });
    </script>
</body>
</html>
