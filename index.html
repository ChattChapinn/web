<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>╔═ CHAT CHAPIN ═╗</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0a0f1a 0%, #05070d 100%);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      position: relative;
      z-index: 2;
      font-size: 3rem;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #00ffff;
      letter-spacing: 3px;
      margin-bottom: 20px;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #00ffff; }
      50% { text-shadow: 0 0 10px #0077ff, 0 0 20px #00ffff, 0 0 40px #00ffff; }
    }

    .logo {
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
      animation: rotateLogo 6s linear infinite, pulseGlow 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #00ffff);
    }

    @keyframes rotateLogo {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 20px #00ffff) brightness(1); }
      50% { filter: drop-shadow(0 0 40px #00ffff) brightness(1.3); }
    }

    .btn {
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00ffff;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
    }

    .btn:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff;
      transform: scale(1.05);
    }

    canvas#particles-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at center, #000 0%, #020305 100%);
    }
  </style>
</head>
<body>
  <img class="logo" src="https://cdn-icons-png.flaticon.com/512/724/724715.png" alt="Logo Chat Chapin" />
  <h1>CHAT CHAPIN</h1>
  <div>
    <button class="btn" onClick="window.location.href='chapiness.html'">Chat Guatemala</button>
    <button class="btn" onClick="window.location.href='chapinessexo.html'" style="margin-left:20px">Chat Guatemala 2</button>
  </div>
  <canvas id="particles-bg"></canvas>

  <script defer src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    // Partículas con estilo robótico/neón
    const shouldAnimate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (shouldAnimate && window.particlesJS) {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 100, density: { enable: true, value_area: 900 } },
          color: { value: ['#00ffff', '#00ffcc', '#0077ff'] }, // neón azul-cian
          shape: { type: 'polygon', polygon: { nb_sides: 6 } }, // formas hexagonales
          opacity: { value: 0.6, random: true },
          size: { value: 4, random: true },
          line_linked: {
            enable: true,
            distance: 120,
            color: '#00ffff',
            opacity: 0.3,
            width: 1.2
          },
          move: {
            enable: true,
            speed: 2.5,
            direction: 'none',
            random: true,
            straight: false,
            out_mode: 'out'
          }
        },
        interactivity: {
          detect_on: 'canvas',
          events: {
            onhover: { enable: true, mode: 'repulse' },
            onclick: { enable: true, mode: 'push' },
            resize: true
          },
          modes: {
            repulse: { distance: 120, duration: 0.4 },
            push: { particles_nb: 4 }
          }
        },
        retina_detect: true
      });
    }
  </script>
</body>
</html>
