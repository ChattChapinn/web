<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Chapines – Entrar a sala</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #f6f7f9;
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: #0078d7;
      color: #fff;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #e9eef4;
      flex-wrap: wrap;
      align-items: center;
    }
    label {
      font-size: 14px;
      color: #333;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #c8d1dc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #0078d7;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      filter: brightness(0.95);
    }
    #error {
      color: #b00020;
      padding: 0 16px 8px;
      min-height: 1.25em;
    }
    iframe {
      width: 100%;
      height: 100vh; /* se ajusta al ocupar toda la pantalla cuando se entra */
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chat Chapines — Conectar a una sala</h1>
  </header>

  <form id="chatForm">
    <div>
      <label for="channel">Sala</label><br />
      <input id="channel" type="text" placeholder="Ej: amigos o #amigos" required />
    </div>
    <div>
      <label for="nick">Apodo (Solo Letras)</label><br />
      <input id="nick" type="text" placeholder="Tu apodo" required />
    </div>
    <div style="align-self: end">
      <button type="submit">Entrar al chat</button>
    </div>
  </form>

  <div id="error"></div>
  <iframe id="chatFrame" loading="lazy" title="Chat Chapines Webchat"></iframe>

  <script>
    const form = document.getElementById('chatForm');
    const ch = document.getElementById('channel');
    const nk = document.getElementById('nick');
    const frame = document.getElementById('chatFrame');
    const errorBox = document.getElementById('error');
    const header = document.querySelector('header');

    const params = new URLSearchParams(location.search);
    if (params.get('sala')) ch.value = params.get('sala');
    if (params.get('apodo')) nk.value = params.get('apodo');

    function buildSrc(channelInput, nickInput) {
      let sala = channelInput.trim();
      if (!sala) return null;
      if (!sala.startsWith('#')) sala = '#' + sala;
      const apodo = nickInput.trim();
      if (!apodo) return null;
      const base = 'https://chat.chatzona.org/index.html';
      const hash = '#nick=' + encodeURIComponent(apodo) + '&channel=' + encodeURIComponent(sala);
      return base + hash;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      const src = buildSrc(ch.value, nk.value);
      if (!src) {
        errorBox.textContent = 'Debes escribir una sala y un apodo.';
        return;
      }
      frame.src = src;

      // Oculta el encabezado y el formulario al entrar
      header.style.display = 'none';
      form.style.display = 'none';
      errorBox.style.display = 'none';

      // Ajusta el alto del iframe a toda la ventana
      frame.style.height = '100vh';
    });

    ch.focus();
  </script>
</body>
</html>
