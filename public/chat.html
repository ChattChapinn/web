<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link
         rel="shortcut icon"
         href="img/icons8-chat-64.png"
         type="image/x-icon"
      />
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
         integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
         crossorigin="anonymous"
      />
      <link rel="stylesheet" href="css/style.css" />
      <title>ManiaChat - Sala de Chat en Tiempo Real</title>
      <meta name="description" content="Aplicación de chat en tiempo real con TypeScript, Express y Socket.IO." />
      <meta property="og:title" content="ManiaChat - Sala de Chat en Tiempo Real" />
      <meta property="og:description" content="Aplicación de chat en tiempo real con TypeScript, Express y Socket.IO." />
      <meta property="og:type" content="website" />
      <meta name="twitter:card" content="summary_large_image" />
   </head>
   <body>
      <div class="chat-container">
         <header class="chat-header">
            <div class="chat-header-brand">
               <img class="spinning-logo chat-header-logo" src="img/logo.png" alt="Logo ManiaChat" />
               <h1 style="color: #f5f6f7">
                  ManiaChat
               </h1>
            </div>
            <div class="header-actions">
               <button id="toggle-sound-btn" class="btn btn-sound-toggle" type="button" title="Silenciar / Activar sonido">
                  <i class="fas fa-volume-up" id="sound-icon"></i>
               </button>
               <button id="toggle-sidebar-btn" class="btn btn-mobile-users" type="button" title="Ver usuarios">
                  <i class="fas fa-users"></i> <span id="users-count-badge">0</span>
               </button>
               <a href="index.html" class="btn">Salir de la sala</a>
            </div>
         </header>
         <main class="chat-main">
            <div class="chat-sidebar" id="chat-sidebar">
               <div class="sidebar-header-mobile">
                  <h3><i class="fas fa-users"></i> En esta sala</h3>
                  <button id="close-sidebar-btn" class="close-sidebar-btn" type="button" title="Cerrar">&times;</button>
               </div>
               <h3><i class="fas fa-comments"></i> Nombre de la sala:</h3>
               <h2 id="room-name"></h2>
               <h3><i class="fas fa-users"></i> Usuarios</h3>
               <p class="sidebar-hint"><small><i class="fas fa-hand-pointer"></i> Clic para hablar en privado o mencionar</small></p>
               <ul id="users"></ul>
            </div>
            <div class="chat-messages"></div>
         </main>
         <div class="chat-form-container">
            <div class="chat-controls-bar">
               <div class="recipient-selector-wrapper">
                  <label for="recipient-select"><i class="fas fa-comment-alt"></i> Enviar a:</label>
                  <select id="recipient-select" class="recipient-select">
                     <option value="ALL">👥 Todos en la sala</option>
                  </select>
               </div>
               <div id="private-badge" class="private-mode-badge hidden">
                  <i class="fas fa-lock"></i> Mensaje Privado Activo
               </div>
            </div>

            <!-- Image Preview Area -->
            <div id="image-preview-container" class="image-preview-container hidden">
               <div class="image-preview-box">
                  <img id="image-preview-img" src="" alt="Vista previa de imagen" />
                  <button type="button" id="remove-image-btn" class="remove-image-btn" title="Quitar imagen">&times;</button>
               </div>
               <div class="image-preview-info">
                  <span id="image-preview-name">foto.jpg</span>
                  <small id="image-preview-size">Foto lista para enviar</small>
               </div>
            </div>

            <form id="chat-form">
               <button type="button" id="emoji-btn" class="emoji-toggle-btn" title="Emojis">
                  😊
               </button>

               <input type="file" id="photo-input" accept="image/*" style="display:none;" />
               <button type="button" id="photo-btn" class="photo-btn" title="Enviar foto o imagen">
                  <i class="fas fa-camera"></i>
               </button>

               <input
                  id="msg"
                  type="text"
                  placeholder="Escribe un mensaje o envía una foto..."
                  autocomplete="off"
               />

               <button class="btn send-button" type="submit">
                  <i class="fas fa-paper-plane"></i> <span class="btn-text">Enviar</span>
               </button>
            </form>

            <!-- Emoji Picker Popover -->
            <div id="emoji-picker" class="emoji-picker hidden">
               <div class="emoji-picker-header">
                  <span>Seleccionar Emoji</span>
                  <button type="button" id="close-emoji-picker" class="close-picker-btn">&times;</button>
               </div>
               <div class="emoji-category-tabs">
                  <button type="button" class="emoji-tab-btn active" data-cat="smileys">😀 Caras</button>
                  <button type="button" class="emoji-tab-btn" data-cat="gestures">👍 Gestos</button>
                  <button type="button" class="emoji-tab-btn" data-cat="hearts">❤️ Reacciones</button>
                  <button type="button" class="emoji-tab-btn" data-cat="fun">🚀 Objetos</button>
               </div>
               <div class="emoji-grid" id="emoji-grid"></div>
            </div>
         </div>
      </div>

      <!-- Lightbox Modal for Fullscreen Photo View -->
      <div id="lightbox-modal" class="lightbox-modal hidden">
         <div class="lightbox-overlay" id="lightbox-overlay"></div>
         <div class="lightbox-content">
            <button type="button" id="close-lightbox" class="close-lightbox-btn" title="Cerrar">&times;</button>
            <img id="lightbox-img" src="" alt="Foto en tamaño completo" />
         </div>
      </div>

      <footer style="margin-top: 25px">
         <div style="text-align: center; color: #f5f6f7" class="credit">
            &copy; Manuel A. Sagastume C.  2,026.
         </div>
      </footer>

      <script
         src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.10.1/qs.min.js"
         integrity="sha512-aTKlYRb1QfU1jlF3k+aS4AqTpnTXci4R79mkdie/bp6Xm51O5O3ESAYhvg6zoicj/PD6VYY0XrYwsWLcvGiKZQ=="
         crossorigin="anonymous"
      ></script>
      <script src="/socket.io/socket.io.js"></script>
      <script src="js/script.js"></script>
   </body>
</html>
