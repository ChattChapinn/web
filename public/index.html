<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta http-equiv="X-UA-Compatible" content="ie=edge" />
      <link
         rel="shortcut icon"
         href="img/icons8-chat-64.png"
         type="image/x-icon"
      />
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
         integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
         crossorigin="anonymous"
      />
      <link rel="stylesheet" href="css/style.css" />
      <title>ManiaChat - Aplicación de Chat en Tiempo Real</title>
      <meta name="description" content="Aplicación de chat en tiempo real con TypeScript, Express y Socket.IO." />
      <meta property="og:title" content="ManiaChat - Aplicación de Chat en Tiempo Real" />
      <meta property="og:description" content="Aplicación de chat en tiempo real con TypeScript, Express y Socket.IO." />
      <meta property="og:type" content="website" />
      <meta name="twitter:card" content="summary_large_image" />
   </head>
   <body>
      <div class="join-container">
         <header class="join-header">
            <img class="spinning-logo" src="img/logo.png" alt="Logo ManiaChat" />
            <h1 style="color: #f5f6f7">
               ManiaChat
            </h1>
         </header>
         <main class="join-main">
            <form action="chat.html">
               <div class="form-control">
                  <label style="color: #f5f6f7" for="username">Nombre de usuario</label>
                  <input
                     type="text"
                     name="username"
                     id="username"
                     placeholder="Ingresa tu nombre de usuario..."
                     required
                  />
               </div>
               <div class="form-control">
                  <label style="color: #f5f6f7">Elige tu Avatar de Perfil</label>
                  <input type="hidden" name="avatar" id="avatar" value="👦" />
                  <div class="avatar-grid avatar-gender-grid" id="avatar-grid">
                     <button type="button" class="avatar-option selected" data-avatar="👦">
                        <span class="avatar-emoji">👦</span>
                        <span class="avatar-label">Masculino</span>
                     </button>
                     <button type="button" class="avatar-option" data-avatar="👩">
                        <span class="avatar-emoji">👩</span>
                        <span class="avatar-label">Femenino</span>
                     </button>
                  </div>
               </div>
               <div class="form-control">
                  <label style="color: #f5f6f7" for="room">Seleccionar sala</label>
                  <select name="room" id="room">
                     <option value="Amistad">Amistad</option>
                     <option value="Ligue">Ligue</option>
                     <option value="Sala-3">Sala 3</option>
                     <option value="Sala-4">Sala 4</option>
                     <option value="Sala-5">Sala 5</option>
                  </select>
               </div>
               <button type="submit" class="btn">Entrar al chat</button>
            </form>
         </main>
         <footer style="margin-top: 25px">
            <div style="text-align: center" class="credit">
               &copy; Manuel A. Sagastume C.  2,026.
            </div>
         </footer>
      </div>

      <script>
         const avatarGrid = document.getElementById('avatar-grid');
         const avatarInput = document.getElementById('avatar');
         if (avatarGrid && avatarInput) {
            avatarGrid.addEventListener('click', (e) => {
               const btn = e.target.closest('.avatar-option');
               if (!btn) return;
               document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
               btn.classList.add('selected');
               avatarInput.value = btn.dataset.avatar;
            });
         }
      </script>
   </body>
</html>
